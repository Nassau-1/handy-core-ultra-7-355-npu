name: Core Ultra 355 NPU Windows and Intune
on:
  push:
    branches: [main, codex/core-ultra-355-npu]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: npu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python -m unittest discover -s scripts/tests -v
      - run: ./scripts/test_driver_policy.ps1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - name: Format changed Rust files
        run: rustfmt --check --edition 2021 src-tauri/src/windows_npu.rs src-tauri/src/main.rs src-tauri/src/managers/model.rs src-tauri/src/managers/transcription.rs src-tauri/src/managed.rs src-tauri/src/audio_toolkit/finance.rs
  windows:
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      sign-binaries: false
      upload-artifacts: true
      asset-prefix: handy-ultra355-npu
      bundle-npu: true
      no-cache: false
